<div class="pizza-card card bg-base-100 w-96 shadow-sm">
    
    <figure>
        <img [src]="pizza.image">
    </figure>
    <div class="card-body">
        <h3 class="card-title">{{ pizza.name }}</h3>
        <p>{{ pizza.price }} $</p>
        <div class="card-actions justify-end">
            <button class="btn btn-primary" (click)="addToCart()">Ajouter</button>
        </div>
    </div>
</div>
